name: Version Bump Check

on:
  pull_request:
    branches: [master]

jobs:
  check-version:
    name: Version Bump Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Each changed plugin bumps its version
        run: |
          set -euo pipefail

          BASE_REF="${{ github.event.pull_request.base.ref }}"
          git fetch origin "$BASE_REF"
          failed=0

          for dir in plugins/*/; do
            dir=${dir%/}
            manifest="$dir/.claude-plugin/plugin.json"
            if git diff --quiet "origin/$BASE_REF...HEAD" -- "$dir"; then
              continue
            fi
            pr=$(jq -r '.version // empty' "$manifest")
            base=$(git show "origin/$BASE_REF:$manifest" 2>/dev/null | jq -r '.version // empty' || true)
            if [ -z "$pr" ]; then
              echo "::error file=$manifest::no version"; failed=1; continue
            fi
            if [ -z "$base" ]; then
              echo "✓ $dir: new plugin at $pr"; continue
            fi
            IFS='.' read -r a b c <<< "$pr"
            IFS='.' read -r x y z <<< "$base"
            if (( a < x )) || (( a == x && b < y )) || (( a == x && b == y && c <= z )); then
              echo "::error file=$manifest::$dir changed but its version $pr is not greater than $base. Installed copies only update when the version changes."
              failed=1
            else
              echo "✓ $dir: $base → $pr"
            fi
          done

          exit $failed
